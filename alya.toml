[package]
name = "otp"
version = "0.1.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "RFC 4226 HOTP and RFC 6238 TOTP one-time password toolkit for Alya backed by alya-lang/crypto"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/otp"
keywords = ["alya", "alya-lang", "package", "otp", "hotp", "totp", "2fa", "mfa", "authenticator", "auth", "security", "crypto"]

[dependencies]
crypto = { git = "https://github.com/alya-lang/crypto", tag = "v0.1.0" }

# Optional: feature-gated API slices. Members name another feature or an
# optional dependency; gate the using code with `@cfg(feature = "...")`
# and provide a `@cfg(not(feature = "..."))` fallback stub (see
# `src/lib.alya` and `src/core/uri.alya`). `default` is active unless
# the caller passes `--no-default-features`; select features explicitly
# via `alya build/run/test/bench/install --features <a,b>`.
[features]
default = ["uri"]
uri = []

